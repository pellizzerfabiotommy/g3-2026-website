## Esempio Google Fonts per importare Space Mono
googlefonts:
  - url: "https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"

chulapa-skin:
  skin: "academia"
  css: "assets/css/custom.css"
  vars:
    font-family-base: "Ubuntu, sans-serif"
    primary: "#145b22"
    secondary: "#dfd3b9"

#chulapa-skin:
  #autothemer  :  true
  #vars:
    #primary: "#07286E"



##################################################
#    Non modificare nulla sotto questa riga      #
##################################################

# Impostazioni di build
#theme: chulapa-jekyll # va usato il remote-theme!!!
plugins:
  - jekyll-feed
  - jekyll-remote-theme
  - jekyll-include-cache

collections:
  pages:
    output: true
    permalink: /:path

footer:
  links:
  - label: "LinkedIn"
    icon: "fab fa-linkedin"
    url: https://www.linkedin.com/company/sobigdata
  - label: "Twitter"
    icon: "fab fa-twitter"
    url: https://www.twitter.com/sobigdata
  copyright: "2026 SoBigData RI"


sass:
  quiet_deps: true

# Gli elementi esclusi possono essere elaborati elencando esplicitamente le directory o
# i relativi percorsi file nella lista `include:`.
#
exclude:
 - .sass-cache/
 - .jekyll-cache/
 - gemfiles/
 - Gemfile
 - Gemfile.lock
 - node_modules/
 - vendor/bundle/
 - vendor/cache/
 - vendor/gems/
 - vendor/ruby/
 - .idea/


livereload: true

remote_theme: dieghernan/chulapa

future: true

defaults:
  - scope:
      path: "assets/images/thumb-charts"
    values:
      image_col: charts
