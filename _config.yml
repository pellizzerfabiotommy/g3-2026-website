# Impostazioni del sito
# Queste impostazioni personalizzano il sito. Nei file HTML le troverai tramite
# {{ site.title }}, {{ site.email }}, ecc. Puoi creare variabili personalizzate:
# saranno accessibili nei template tramite {{ site.myvariable }}.

title: "Quando la montagna si spopola - Big Data Project"
subtitle: "Progetto di Data Science"
description: >- # ignora i ritorni a capo fino a "baseurl:"
  Un progetto di data science che analizza lo spopolamento dei piccoli comuni
  montani italiani, incrociando dati demografici, economici, climatici e
  infrastrutturali con l'esperienza diretta di chi vive la montagna ogni giorno.


# Riportare il github del gruppo di progetto e quello del sito web (se differente).
# Tali informazioni appariranno nel Footer del sito.
github_repo:
  - name: "Repository del progetto Quando la montagna si spopola"
    url: "https://github.com/pellizzerfabiotommy/g3-2026-website"

markdown: kramdown

baseurl: "/g3-2026-website-main"
#baseurl: ""
url: "" # se pubblichi su GitHub Pages, inserisci qui "https://TUO_USERNAME.github.io"

#################################
#    Configurazione navigazione #
#################################

navbar:
  style :  dual # non modificarlo: imposta lo stile della navbar.
  brand: # brand della navbar, mostrato a sinistra.
    title :  "Quando la montagna si spopola"
    img: "/assets/images/Logo_masthead.png" # non modificare
    url: /
  nav:
  - title: Home
    url: /
  - title: Metodologia
    url: /metodologia/
  - title: Risultati
    url: /risultati/
  - title: Casi Studio
    url: /casi-studio/

  - title: SBD Master # deve essere sempre l'ultimo elemento della navbar, non modificarlo
    url: https://masterbigdata.it/

